name: CI

on:
  push:
    branches: ["**"] # branches only; tags are handled by release.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Frontend checks (svelte-check + tsc)
        run: npm run check

      # Also produces dist/, which tauri::generate_context!() needs at compile time.
      - name: Frontend build
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  integration:
    name: integration (docker sshd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # keyring's Secret Service backend links libdbus.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: integration

      - name: Start test SSH servers
        run: docker compose -f docker/test/compose.yml up -d --build --wait

      - name: Integration tests
        env:
          PATCHBAY_DOCKER_TESTS: "1"
        run: cargo test -p patchbay-core --tests

      - name: sshd logs
        if: failure()
        run: docker compose -f docker/test/compose.yml logs --no-color

      - name: Stop test SSH servers
        if: always()
        run: docker compose -f docker/test/compose.yml down -v
